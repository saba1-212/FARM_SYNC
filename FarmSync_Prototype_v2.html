<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmSync — Farmer Procurement Slot &amp; Smart Queue Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1F6B3F;
  --primary-dark:#123F26;
  --primary-light:#E7F2EA;
  --accent:#C8912A;
  --accent-dark:#9C6F1A;
  --bg:#F4F5F0;
  --surface:#FFFFFF;
  --surface-2:#FAFBF8;
  --text:#1A241D;
  --text-muted:#5C6B5F;
  --text-faint:#8B978E;
  --border:#E0E4DA;
  --success:#2E7D4F;
  --success-bg:#E7F5EC;
  --warning:#B4791A;
  --warning-bg:#FBF0DD;
  --danger:#C0392B;
  --danger-bg:#FBE9E7;
  --info:#2758C9;
  --info-bg:#E8EEFD;
  --font-display:'Manrope','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-body:'Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-mono:'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(18,63,38,0.06);
  --shadow-md:0 4px 16px rgba(18,63,38,0.09);
  --shadow-lg:0 12px 32px rgba(18,63,38,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:64px 64px;
  background-attachment:fixed;
  background-color:var(--bg);
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:800;margin:0;color:var(--text);letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
a{color:inherit;}
::selection{background:var(--accent);color:#fff;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.role-switch-bar{
  background:var(--primary-dark);
  color:#fff;
  padding:8px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12.5px;
  gap:12px;
  flex-wrap:wrap;
}
.role-switch-bar .rs-label{opacity:0.75;letter-spacing:0.02em;}
.role-switch-bar .rs-buttons{display:flex;gap:6px;}
.role-switch-bar button{
  background:transparent;border:1px solid rgba(255,255,255,0.28);color:#fff;
  padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:600;
  transition:background .15s, border-color .15s;
}
.role-switch-bar button.active{background:var(--accent);border-color:var(--accent);color:#2A1B04;}
.role-switch-bar button:not(.active):hover{background:rgba(255,255,255,0.12);}
.role-switch-bar .rs-note{opacity:0.65;font-size:11.5px;}

.main-wrap{flex:1;display:flex;justify-content:center;padding:28px 16px 60px;}

/* ---------- Phone frame (farmer) ---------- */
.phone-frame{
  width:412px;max-width:100%;
  background:var(--surface);
  border-radius:34px;
  border:10px solid #14201A;
  box-shadow:var(--shadow-lg);
  overflow:hidden;
  min-height:840px;
  display:flex;flex-direction:column;
  position:relative;
}
.phone-notch{
  height:26px;background:#14201A;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.phone-notch::after{content:'';width:70px;height:6px;background:#2A382F;border-radius:4px;}
.phone-screen{flex:1;display:flex;flex-direction:column;overflow-y:auto;background:var(--surface-2);}

/* ---------- Farmer top bar ---------- */
.f-topbar{
  background:var(--primary);color:#fff;padding:16px 18px 14px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.f-topbar .f-brand{display:flex;align-items:center;gap:8px;}
.f-topbar .f-brand-mark{
  width:30px;height:30px;border-radius:8px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:#2A1B04;font-size:15px;
}
.f-topbar .f-brand-name{font-family:var(--font-display);font-weight:800;font-size:16px;}
.f-topbar .f-icon-btn{
  background:rgba(255,255,255,0.14);border:none;color:#fff;width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;
}
.f-topbar .f-icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1.5px solid var(--primary);}
.f-back-row{display:flex;align-items:center;gap:10px;padding:14px 18px 4px;flex-shrink:0;}
.f-back-btn{background:none;border:none;color:var(--primary);font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px;padding:4px;}
.f-back-row h2{font-size:17px;}

.f-body{padding:16px 18px 90px;flex:1;}
.f-body.no-pad-bottom{padding-bottom:20px;}

/* Bottom nav */
.f-bottomnav{
  display:flex;background:var(--surface);border-top:1px solid var(--border);
  padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
  position:sticky;bottom:0;flex-shrink:0;
}
.f-bottomnav button{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text-faint);font-size:10.5px;font-weight:600;padding:4px 0;border-radius:10px;
}
.f-bottomnav button .nav-ic{font-size:18px;}
.f-bottomnav button.active{color:var(--primary);}
.f-bottomnav button.active .nav-ic{transform:translateY(-1px);}

/* ---------- Cards & generic components ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;}
.card + .card{margin-top:12px;}
.section-label{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px;}
.hairline{height:1px;background:var(--border);border:none;margin:14px 0;}

.btn{
  border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:filter .12s, transform .05s;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-accent{background:var(--accent);color:#2A1B04;}
.btn-accent:hover{filter:brightness(1.06);}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
.btn-outline:hover{background:var(--primary-light);}
.btn-danger-outline{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
.btn-ghost{background:transparent;color:var(--text-muted);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;letter-spacing:0.02em;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-warning{background:var(--warning-bg);color:var(--warning);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.badge-info{background:var(--info-bg);color:var(--info);}
.badge-neutral{background:var(--primary-light);color:var(--primary-dark);}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;}
.field .hint{font-size:11.5px;color:var(--text-faint);margin-top:5px;}
.input, .select{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;
  background:var(--surface);color:var(--text);
}
.input:focus, .select:focus{border-color:var(--primary);}
.otp-row{display:flex;gap:8px;}
.otp-row input{
  width:44px;height:52px;text-align:center;font-size:20px;font-weight:700;border:1.5px solid var(--border);
  border-radius:10px;font-family:var(--font-mono);
}
.otp-row input:focus{border-color:var(--primary);}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  border:1.5px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 14px;
  font-size:13.5px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;
}
.chip.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark);}
.chip .chip-ic{font-size:16px;}

.stepper{display:flex;align-items:center;gap:4px;margin-bottom:18px;}
.stepper .step{flex:1;height:4px;border-radius:3px;background:var(--border);}
.stepper .step.done{background:var(--primary);}

.token-badge{
  background:linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color:#fff;border-radius:var(--radius-lg);padding:20px;position:relative;overflow:hidden;
}
.token-badge::before{
  content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,0.07);
}
.token-badge::after{
  content:'';position:absolute;left:-20px;bottom:-40px;width:100px;height:100px;border-radius:50%;
  background:rgba(255,255,255,0.05);
}
.token-badge .tb-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.75;font-weight:700;}
.token-badge .tb-token{font-family:var(--font-mono);font-size:34px;font-weight:600;letter-spacing:0.03em;margin:4px 0 10px;position:relative;}
.token-badge .tb-meta{display:flex;justify-content:space-between;font-size:12.5px;opacity:0.9;position:relative;}
.perforation{
  height:0;border-top:2px dashed rgba(255,255,255,0.35);margin:14px 0 12px;position:relative;
}

.qr-box{
  width:168px;height:168px;margin:0 auto;background:#fff;border-radius:12px;padding:10px;
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
}

.list-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;}
.list-row + .list-row{border-top:1px solid var(--border);}
.list-row .lr-label{color:var(--text-muted);font-size:13px;}
.list-row .lr-value{font-weight:700;font-size:13.5px;text-align:right;}

.empty-state{text-align:center;padding:44px 20px;color:var(--text-muted);}
.empty-state .es-ic{font-size:34px;margin-bottom:10px;}
.empty-state h4{font-size:15px;margin-bottom:6px;color:var(--text);}
.empty-state p{font-size:13px;margin-bottom:16px;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--primary-dark);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-lg);z-index:999;display:flex;align-items:center;gap:8px;max-width:90vw;
  animation:toastIn .18s ease;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

.progress-track{height:8px;border-radius:6px;background:var(--border);overflow:hidden;}
.progress-fill{height:100%;background:var(--primary);border-radius:6px;transition:width .3s ease;}

.timeline{display:flex;flex-direction:column;}
.tl-item{display:flex;gap:12px;}
.tl-marker-col{display:flex;flex-direction:column;align-items:center;}
.tl-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
.tl-dot.done{background:var(--primary);color:#fff;}
.tl-dot.active{background:var(--accent);color:#2A1B04;box-shadow:0 0 0 4px var(--warning-bg);}
.tl-dot.todo{background:var(--border);color:var(--text-faint);}
.tl-line{width:2px;flex:1;background:var(--border);min-height:22px;}
.tl-line.done{background:var(--primary);}
.tl-content{padding-bottom:22px;}
.tl-content h5{font-size:13.5px;margin-bottom:2px;}
.tl-content p{font-size:12px;color:var(--text-muted);}

.centre-load-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;}
.load-low{background:var(--success-bg);color:var(--success);}
.load-medium{background:var(--warning-bg);color:var(--warning);}
.load-high{background:var(--danger-bg);color:var(--danger);}

.lang-pill-row{display:flex;gap:6px;}
.lang-pill{border:1.5px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;font-weight:700;flex:1;}
.lang-pill.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark);}

/* ---------- Desktop shell (officer / admin) ---------- */
.desktop-shell{
  width:100%;max-width:1180px;background:var(--surface);border-radius:var(--radius-lg);
  border:1px solid var(--border);box-shadow:var(--shadow-lg);overflow:hidden;min-height:760px;
  display:flex;
}
.desktop-shell.centered{align-items:center;justify-content:center;}
.d-sidebar{
  width:230px;background:var(--primary-dark);color:#fff;display:flex;flex-direction:column;flex-shrink:0;
}
.d-sidebar .ds-brand{padding:22px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.1);}
.d-sidebar .ds-brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:#2A1B04;}
.d-sidebar .ds-brand-name{font-family:var(--font-display);font-weight:800;font-size:16px;}
.d-sidebar .ds-brand-sub{font-size:10.5px;opacity:0.6;letter-spacing:0.04em;}
.d-sidebar .ds-nav{padding:14px 12px;flex:1;}
.d-sidebar .ds-nav button{
  width:100%;text-align:left;background:none;border:none;color:rgba(255,255,255,0.72);
  padding:11px 14px;border-radius:9px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:2px;
}
.d-sidebar .ds-nav button.active{background:rgba(255,255,255,0.13);color:#fff;}
.d-sidebar .ds-nav button:hover:not(.active){background:rgba(255,255,255,0.06);}
.d-sidebar .ds-nav .nav-ic{font-size:16px;width:18px;text-align:center;}
.d-sidebar .ds-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,0.1);font-size:12px;}
.d-sidebar .ds-footer .df-name{font-weight:700;}
.d-sidebar .ds-footer .df-role{opacity:0.6;font-size:11px;}
.d-sidebar .ds-footer button{margin-top:8px;width:100%;background:rgba(255,255,255,0.1);border:none;color:#fff;padding:7px;border-radius:7px;font-size:11.5px;font-weight:600;}

.d-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.d-topbar{
  padding:18px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;
}
.d-topbar h2{font-size:19px;}
.d-topbar .d-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.d-content{padding:24px 28px 40px;overflow-y:auto;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;}
.stat-card .stat-label{font-size:11.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
.stat-card .stat-value{font-family:var(--font-display);font-size:26px;font-weight:800;margin-top:6px;}
.stat-card .stat-sub{font-size:11.5px;color:var(--text-faint);margin-top:4px;}

.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);
  padding:9px 12px;border-bottom:2px solid var(--border);font-weight:700;background:var(--surface-2);
}
.data-table td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr.current-row{background:var(--primary-light);}
.table-actions{display:flex;gap:6px;flex-wrap:wrap;}

.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

.bar-chart{display:flex;flex-direction:column;gap:10px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-row .bar-label{width:110px;font-size:12px;color:var(--text-muted);flex-shrink:0;}
.bar-row .bar-track{flex:1;height:16px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--border);}
.bar-row .bar-fill{height:100%;background:var(--primary);border-radius:5px 0 0 5px;}
.bar-row .bar-value{width:44px;text-align:right;font-size:12px;font-weight:700;flex-shrink:0;}

.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);}

.modal-overlay{position:fixed;inset:0;background:rgba(18,63,38,0.45);display:flex;align-items:center;justify-content:center;z-index:900;padding:20px;}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);padding:24px;max-width:460px;width:100%;box-shadow:var(--shadow-lg);max-height:86vh;overflow-y:auto;}
.modal-box h3{font-size:17px;margin-bottom:14px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}

@media (max-width:980px){
  .desktop-shell{flex-direction:column;min-height:auto;}
  .d-sidebar{width:100%;flex-direction:row;align-items:center;overflow-x:auto;}
  .d-sidebar .ds-nav{display:flex;padding:8px;flex:none;}
  .d-sidebar .ds-nav button{white-space:nowrap;margin-bottom:0;margin-right:2px;}
  .d-sidebar .ds-footer{display:none;}
  .two-col{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:1fr;}
}
/* ---------- Connectivity, simulation & demo guide ---------- */
.rs-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.conn-pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;
  font-size:11.5px;font-weight:700;letter-spacing:0.02em;border:1px solid transparent;cursor:pointer;
  background:rgba(255,255,255,0.10);color:#fff;border-color:rgba(255,255,255,0.28);
}
.conn-pill .conn-led{width:7px;height:7px;border-radius:50%;background:#5FD08A;box-shadow:0 0 0 3px rgba(95,208,138,0.22);}
.conn-pill.is-offline{background:rgba(192,57,43,0.30);border-color:rgba(255,255,255,0.42);}
.conn-pill.is-offline .conn-led{background:#FF8A76;box-shadow:0 0 0 3px rgba(255,138,118,0.22);}

.offline-banner{
  display:flex;align-items:center;gap:9px;background:var(--warning-bg);border-bottom:1px solid #E9D7AF;
  padding:8px 14px;font-size:11.5px;color:#6E4A05;line-height:1.35;
}
.offline-banner b{font-weight:700;}

.sim-pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:11.5px;
  font-weight:700;border:1px solid rgba(255,255,255,0.28);background:transparent;color:#fff;cursor:pointer;
}
.sim-pill.is-on{background:var(--accent);border-color:var(--accent);color:#2A1B04;}
.guide-pill{margin-left:2px;}
.sim-pill .sim-led{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55;}
.sim-pill.is-on .sim-led{opacity:1;animation:simpulse 1.1s ease-in-out infinite;}
@keyframes simpulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.5);opacity:.35;}}

/* Guided jury demo */
.demo-panel{
  position:fixed;right:18px;bottom:18px;z-index:61;width:330px;max-width:calc(100vw - 36px);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);overflow:hidden;
}
.demo-head{background:var(--primary-dark);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;}
.demo-head h4{color:#fff;font-size:13.5px;}
.demo-head .dh-sub{font-size:10.5px;opacity:0.72;margin-top:2px;letter-spacing:0.03em;}
.demo-close{background:transparent;border:none;color:#fff;font-size:17px;opacity:0.75;line-height:1;padding:2px 4px;}
.demo-close:hover{opacity:1;}

function el(html){
  html = html.trim();
  let wrapperTag = 'div';
  if(/^<(thead|tbody|tfoot)[\s>]/i.test(html)) wrapperTag = 'table';
  else if(/^<tr[\s>]/i.test(html)) wrapperTag = 'tbody';
  else if(/^<(td|th)[\s>]/i.test(html)) wrapperTag = 'tr';
  const d = document.createElement(wrapperTag);
  d.innerHTML = html;
  return d.firstElementChild;
}

/* 13.2 WHERE — Smart Centre Recommendation.
   Heuristic: the nearest eligible centre that isn't already at High load —
   farmers prioritise proximity, but not at the cost of a centre that's full.
   Falls back to the nearest centre overall if every eligible one is High. */
function aiRecommendCentre(crop){
  const eligible = state.centres.filter(c=>!crop || c.crops.includes(crop));
  const pool = eligible.length ? eligible : state.centres;
  const byDistance = pool.slice().sort((a,b)=>a.distanceKm-b.distanceKm);
  const notOverloaded = byDistance.filter(c=>centreLoad(c)!=='high');
  const centre = notOverloaded[0] || byDistance[0];
  const wait = computeWait(centre.id);
  const headroomPct = Math.round(100*(centre.dailyCapacity-centre.bookedToday)/centre.dailyCapacity);
  return {centre, wait, headroomPct};
}

/* WHEN — Best Visit Time, grounded in each centre's live booking level right now. */
function aiBestVisitTime(centreId){
  const c = findCentre(centreId);
  const pct = Math.round(100*c.bookedToday/c.dailyCapacity);
  const load = centreLoad(c);
  if(load==='low') return {label:'Right now is a good time', detail:'This centre is at '+pct+'% of daily capacity ('+c.bookedToday+'/'+c.dailyCapacity+'), so queues are shorter than usual.'};
  if(load==='medium') return {label:'Morning slots recommended', detail:'This centre is at '+pct+'% of daily capacity today. Earlier slots tend to fill up less than the afternoon rush.'};
  return {label:'Consider a nearby centre or tomorrow', detail:'This centre is already at '+pct+'% of daily capacity ('+c.bookedToday+'/'+c.dailyCapacity+'), so waiting time is currently high.'};
}

/* 13.1 AI "Pre-Check My Crop" — preliminary, non-official visual screening.
   The farmer uploads a real photo; the result is derived deterministically
   from the image itself (via a hash of its data), so the same photo always
   produces the same result — this reads as a genuine analysis rather than
   a random text generator, without requiring a real CV backend. A presenter
   can also force a specific outcome for a live demo by naming the file with
   "clean" or "concern" (e.g. clean_sample.jpg) — still driven by the actual
   upload, just a predictable one. */
function hashString(str){
  let h = 0;
  const s = str || '';
  for(let i=0;i<s.length;i+=41){ h = (h*33 + s.charCodeAt(i)) >>> 0; }
  return h;
}
function analyzeCropImage(dataUrl, fileName, crop){
  const name = (fileName||'').toLowerCase();
  let concern;
  if(/concern|damage|moist|impurity|bad|reject/.test(name)) concern = true;
  else if(/clean|good|dry|fresh/.test(name)) concern = false;
  else concern = (hashString(dataUrl) % 2) === 1;

  const cropLabel = (crop||'your crop').toLowerCase();
  if(!concern){
    return {
      result:'clean',
      note:'No obvious visual concern detected.',
      observations:[
        'No obvious excessive foreign material detected',
        'No major visible discolouration detected',
        'Crop appears visually consistent with '+cropLabel
      ]
    };
  }
  return {
    result:'concern',
    note:'Possible quality concern flagged.',
    observations:[
      'Visible impurities or damaged/discoloured grains may be present'
    ]
  };
}

/* 13.4 Smart Transport Pooling.
   Deterministic (not random) so the same centre+slot always shows the same
   coordination group — important for a repeatable jury demo. */
function poolInfoFor(centreId, slot, village){
  const c = findCentre(centreId);
  if(!c) return null;
  // The plan's own worked example: Centre A, 10–11 AM demo slot.
  if(centreId==='C-A' && slot==='10:00–11:00 AM'){
    return {count:4, villages:[village||'Rampur','Gollapally','Kodimyal']};
  }
  let h = 0;
  for(let i=0;i<(centreId+slot).length;i++) h = (h*31 + (centreId+slot).charCodeAt(i)) >>> 0;
  const count = 2 + (h % 4); // deterministic 2-5
  const others = state.users.filter(u=>u.role==='Farmer' && u.district===c.address.split(',').pop().trim().split(' ').pop())
    .map(u=>u.village);
  const villages = [village, ...others].filter((v,i,a)=>v && a.indexOf(v)===i).slice(0,3);
  return {count, villages: villages.length ? villages : [village||'nearby villages']};
}

let SIM_TIMER = null;
function toggleSim(){
  state.sim.running = !state.sim.running;
  if(state.sim.running){
    SIM_TIMER = setInterval(simStep, 4000);
    showToast('Live simulation started — queue moves every 4s','▶️');

  }

function simStep(){
  state.sim.tick++;
  // Advance each centre that still has farmers waiting ahead of the demo farmer.
  state.centres.forEach(c=>{
    const q = state.queues[c.id];
    const next = q.find(x=>x.status==='Booked' || x.status==='Arrived');
    if(!next) return;
    const f = state.farmer;
    // Never auto-complete the demo farmer — the officer does that on stage.
    if(f.activeBooking && next.token===f.activeBooking.token) return;
    next.status = 'Completed';
    state.completedToday[c.id] = (state.completedToday[c.id]||0)+1;
  });
  notifyIfTurnNear();
  render();
}
/* Turn-approaching alert (plan 3.6 / 3.10) */
function notifyIfTurnNear(){
  const f = state.farmer;
  if(!f.activeBooking || f.activeBooking.status==='Completed') return;
  const q = state.queues[f.activeBooking.centreId] || [];
  const idx = q.findIndex(x=>x.token===f.activeBooking.token);
  if(idx < 0) return;
  const ahead = q.slice(0, idx).filter(x=>x.status!=='Completed' && x.status!=='Skipped').length;
  const lead = state.admin.settings.turnAlertLead;
  if(ahead <= lead && !f._turnAlerted){
    f._turnAlerted = true;
    f.notifications.unshift({id:Date.now(), title:'Your turn is approaching',
      body:'Only '+ahead+' farmer(s) ahead of you. Please reach the counter with your QR pass.',
      time:'Just now', read:false, icon:'⏰'});
    showToast('Your turn is approaching — '+ahead+' ahead','⏰');
  }
}
function qrPatternSVG(seed, size){
  size = size || 140;
  // deterministic pseudo-QR pattern purely for visual representation (not a scannable code)
  let h = 0;
  for(let i=0;i<seed.length;i++){ h = (h*31 + seed.charCodeAt(i)) >>> 0; }
  const cells = 11;
  const cell = size/cells;
  let rects = '';
  function rnd(){ h = (h*1103515245 + 12345) >>> 0; return (h % 1000)/1000; }
  for(let y=0;y<cells;y++){
    for(let x=0;x<cells;x++){
      const isFinder = (x<3&&y<3)||(x>cells-4&&y<3)||(x<3&&y>cells-4);
      if(isFinder) continue;
      if(rnd() > 0.56){ rects += '<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+cell+'" height="'+cell+'" fill="#123F26"/>'; }
    }
  }
  function finder(fx,fy){
    return '<rect x="'+(fx*cell)+'" y="'+(fy*cell)+'" width="'+(cell*3)+'" height="'+(cell*3)+'" fill="#123F26"/>'+
           '<rect x="'+((fx+0.6)*cell)+'" y="'+((fy+0.6)*cell)+'" width="'+(cell*1.8)+'" height="'+(cell*1.8)+'" fill="#fff"/>'+
           '<rect x="'+((fx+1.05)*cell)+'" y="'+((fy+1.05)*cell)+'" width="'+(cell*0.9)+'" height="'+(cell*0.9)+'" fill="#123F26"/>';
  }
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" xmlns="http://www.w3.org/2000/svg">'+
    '<rect width="'+size+'" height="'+size+'" fill="#fff"/>'+
    rects + finder(0,0) + finder(cells-3,0) + finder(0,cells-3) +
    '</svg>';
}
/* Estimated wait = farmers ahead x avg processing time / active counters  (plan 6).
   Pass beforeToken to count only the farmers genuinely AHEAD of that token;
   omit it to get the centre's total pending queue length. */
function computeWait(centreId, beforeToken){
  const q = state.queues[centreId] || [];
  const pending = x => x.status!=='Completed' && x.status!=='Skipped';
  let list = q;
  if(beforeToken){
    const idx = q.findIndex(x=>x.token===beforeToken);
    if(idx >= 0) list = q.slice(0, idx);
  }
  const ahead = list.filter(pending).length;
  const c = findCentre(centreId);
  const active = Math.max(1, c.activeCounters);
  const mins = Math.round((ahead * c.avgProcessingMin) / active);
  return {ahead, mins};
}

function openDirections(c){
  const url = 'https://www.google.com/maps/dir/?api=1&destination='+c.lat+','+c.lng;
  window.open(url, '_blank');
  showToast('Opening directions to '+c.name.split('—')[1].trim(),'🧭');

function discoveryMapSVG(centres, highlightId){
  const lats = centres.map(c=>c.lat), lngs = centres.map(c=>c.lng);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats), minLng=Math.min(...lngs), maxLng=Math.max(...lngs);
  const pad=40, w=340, h=260;
  function pt(c){
    const x = pad + ((c.lng-minLng)/((maxLng-minLng)||1)) * (w-2*pad);
    const y = h-pad - ((c.lat-minLat)/((maxLat-minLat)||1)) * (h-2*pad);
    return [x,y];
  }
  let markers = '';
  centres.forEach(c=>{
    const [x,y] = pt(c);
    const load = centreLoad(c);
    const color = load==='low' ? '#2E7D4F' : load==='medium' ? '#B4791A' : '#C0392B';
    const big = c.id===highlightId;
    markers += '<g>'+
      '<circle cx="'+x+'" cy="'+(y+2)+'" r="'+(big?13:10)+'" fill="rgba(18,63,38,0.15)"/>'+
      '<path d="M'+x+' '+(y-16)+' c-8 0 -14 6 -14 14 c0 10 14 24 14 24 s14 -14 14 -24 c0 -8 -6 -14 -14 -14 z" fill="'+color+'" stroke="#fff" stroke-width="2"/>'+
      '<circle cx="'+x+'" cy="'+(y-2)+'" r="5" fill="#fff"/>'+
      '<text x="'+x+'" y="'+(y+34)+'" font-size="9.5" font-family="Inter,sans-serif" font-weight="700" fill="#123F26" text-anchor="middle">'+c.id+'</text>'+
      '</g>';
  });
  // farmer marker roughly center-bottom
  const fx = w/2, fy = h-18;
  markers += '<g><circle cx="'+fx+'" cy="'+fy+'" r="8" fill="#C8912A" stroke="#fff" stroke-width="2.5"/><text x="'+fx+'" y="'+(fy+20)+'" font-size="9" font-family="Inter,sans-serif" font-weight="700" fill="#5C6B5F" text-anchor="middle">You</text></g>';
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">'+
    '<rect width="'+w+'" height="'+h+'" fill="#EAF0E6"/>'+
    '<path d="M0 40 Q 90 10 180 45 T 340 30" stroke="#D7E2D0" stroke-width="14" fill="none"/>'+
    '<path d="M0 180 Q 120 210 220 175 T 340 200" stroke="#D7E2D0" stroke-width="10" fill="none"/>'+
    markers+
    '</svg>';
}

function screenBooking(){
  const f = state.farmer;
  if(!f.bookingStep) f.bookingStep = 1;

  const stepper = el('<div class="stepper"></div>');
  for(let i=1;i<=4;i++){ const s=el('<div class="step"></div>'); if(i<=f.bookingStep) s.classList.add('done'); stepper.appendChild(s); }
  wrap.appendChild(stepper);

  const d = f.bookingDraft;

  if(f.bookingStep===1){
    wrap.appendChild(el('<h3 style="font-size:15px;margin-bottom:12px;">Step 1 · Select Crop</h3>'));
    const chips = el('<div class="chip-row"></div>');
    ['Paddy','Wheat','Maize','Cotton','Other'].forEach(crop=>{
      const c = el('<div class="chip"><span class="chip-ic">'+CROP_ICONS[crop]+'</span>'+crop+'</div>');
      if(d.crop===crop) c.classList.add('selected');
      c.style.cursor='pointer';
      c.onclick=()=>{ d.crop=crop; render(); };
      chips.appendChild(c);
    });
    wrap.appendChild(chips);
    wrap.appendChild(el('<div class="field" style="margin-top:16px;"><label>Expected Quantity (quintals)</label><input class="input" id="qtyInput" type="number" min="1" placeholder="e.g. 20" value="'+(d.quantity||'')+'"/></div>'));
    const next = el('<button class="btn btn-primary btn-block">Continue</button>');
    next.onclick = ()=>{
      const qtyEl = document.getElementById('qtyInput');
      const qty = parseFloat(qtyEl.value);
      if(!d.crop){ showToast('Please select a crop','⚠️'); return; }
      if(!qty || qty<=0){ showToast('Enter expected quantity','⚠️'); return; }
      d.quantity = qty;
      f.bookingStep=2; render();
    };
    wrap.appendChild(next);

    const preCheck = el('<button class="btn btn-ghost btn-block" style="margin-top:10px;border:1.5px dashed var(--border);">🔍 Run AI Crop Pre-Check first (optional)</button>');
    preCheck.onclick = ()=>{ f.screen='cropcheck'; render(); };
    wrap.appendChild(preCheck);
  }

  else if(f.bookingStep===2){
    wrap.appendChild(el('<h3 style="font-size:15px;margin-bottom:12px;">Step 2 · Select Centre</h3>'));
    const eligible = state.centres.filter(c=>c.crops.includes(d.crop) || d.crop==='Other');
    eligible.forEach(c=>{
      const w = computeWait(c.id);
      const full = c.bookedToday >= c.dailyCapacity;
      const row = el('<div class="card" style="padding:12px;"></div>');
      row.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;">'+

        '<span class="centre-load-badge load-'+centreLoad(c)+'">'+centreLoad(c)+'</span></div>';
      row.style.cursor = full? 'not-allowed':'pointer';
      row.style.opacity = full? '0.55':'1';
      if(d.centreId===c.id) row.style.borderColor='var(--primary)';
      row.onclick = ()=>{ if(full){ showToast('This centre is full today','⚠️'); return; } d.centreId=c.id; render(); };
      wrap.appendChild(row);
    });
    const nav = el('<div style="display:flex;gap:10px;margin-top:14px;"></div>');
    const back = el('<button class="btn btn-outline btn-block">Back</button>');
    back.onclick=()=>{ f.bookingStep=1; render(); };
    const next = el('<button class="btn btn-primary btn-block">Continue</button>');
    next.onclick=()=>{ if(!d.centreId){ showToast('Select a procurement centre','⚠️'); return; } f.bookingStep=3; render(); };
    nav.appendChild(back); nav.appendChild(next);
    wrap.appendChild(nav);
  }

  else if(f.bookingStep===3){
    wrap.appendChild(el('<h3 style="font-size:15px;margin-bottom:12px;">Step 3 · Select Date & Slot</h3>'));
    const dates = ['26 Aug 2026','27 Aug 2026','28 Aug 2026','29 Aug 2026'];
    wrap.appendChild(el('<div class="section-label">Date</div>'));
    const dateRow = el('<div class="chip-row" style="margin-bottom:16px;"></div>');

      const c = el('<div class="chip">'+dt+'</div>');

      c.style.cursor='pointer';
      c.onclick=()=>{ d.date=dt; render(); };
      dateRow.appendChild(c);
    });
    wrap.appendChild(dateRow);

    wrap.appendChild(el('<div class="section-label">Available Time Slots</div>'));
    const slots = [
      {time:'8:00–9:00 AM', capLeft:6}, {time:'9:00–10:00 AM', capLeft:3}, {time:'10:00–11:00 AM', capLeft:9},
      {time:'11:00 AM–12:00 PM', capLeft:0}, {time:'1:00–2:00 PM', capLeft:11}, {time:'2:00–3:00 PM', capLeft:2},
    ];
    const slotGrid = el('<div class="chip-row"></div>');

function advanceQueue(centreId){
  const q = state.queues[centreId];
  let processed = q.find(x=>x.status==='Processing');
  if(processed){ processed.status='Completed'; }
  let arrived = q.filter(x=>x.status==='Arrived');
  if(arrived.length){ arrived[0].status='Processing'; }
  let booked = q.filter(x=>x.status==='Booked');
  if(booked.length && arrived.length<2){ booked[0].status='Arrived'; }

  // sync farmer's own booking if it matches
  const f = state.farmer;
  if(f.activeBooking && f.activeBooking.centreId===centreId){
    const mine = q.find(x=>x.token===f.activeBooking.token);
    if(mine){
      if(mine.status==='Arrived' && f.activeBooking.status==='Booked'){
        f.activeBooking.status='Arrived';
        f.notifications.unshift({id:Date.now(),title:'Turn Approaching',body:'Your token '+mine.token+' will be called soon. Please proceed to the centre.',time:'Just now',read:false,icon:'⏰'});
      }
      if(mine.status==='Processing'){ f.activeBooking.status='Verification'; }
      if(mine.status==='Completed' && f.activeBooking.status!=='Completed'){
        f.activeBooking.status='Completed';
        f.notifications.unshift({id:Date.now(),title:'Procurement Completed',body:'Your procurement for token '+mine.token+' is complete.',time:'Just now',read:false,icon:'✅'});
      }
    }
  }
  showToast('Queue updated','🔄');
}

      '<div class="list-row"><span class="lr-label">Rate</span><span class="lr-value">'+fmtINR(b.rate||2480)+' / qtl</span></div>'+
      '<div class="list-row"><span class="lr-label">Transaction ID</span><span class="lr-value" style="font-family:var(--font-mono);">'+(b.txnId||'Pending')+'</span></div>';
    wrap.appendChild(card);

    // Payment timeline: Processing -> Completed
    const stages = ['Processing','Completed'];
    const curIdx = b.paymentStatus==='Completed' ? 1 : 0;
    const tlCard = el('<div class="card" style="margin-top:10px;"></div>');
    tlCard.appendChild(el('<div class="section-label">Payment Timeline</div>'));
    const tl = el('<div class="timeline"></div>');
    stages.forEach((s,i)=>{
      const item = el('<div class="tl-item"></div>');
      const markerCol = el('<div class="tl-marker-col"></div>');
      const dot = el('<div class="tl-dot '+(i<curIdx?'done':i===curIdx?'active':'todo')+'">'+(i<curIdx?'✓':(i+1))+'</div>');
      markerCol.appendChild(dot);
      if(i<stages.length-1){ const line = el('<div class="tl-line '+(i<curIdx?'done':'')+'"></div>'); markerCol.appendChild(line); }
      item.appendChild(markerCol);
      item.appendChild(el('<div class="tl-content"><h5>Payment '+s+'</h5></div>'));
      tl.appendChild(item);
    });
    tlCard.appendChild(tl);
    wrap.appendChild(tlCard);

    if(b.paymentStatus==='Processing'){
      const sim = el('<div class="card" style="margin-top:12px;background:var(--primary-light);border-color:var(--primary);"></div>');
      sim.appendChild(el('<p style="font-size:12px;color:var(--primary-dark);margin-bottom:8px;"><b>Demo control:</b> simulate bank settlement.</p>'));
      const btn = el('<button class="btn btn-primary btn-block btn-sm">Simulate Payment Completion</button>');
      btn.onclick = ()=>{
        b.paymentStatus='Completed'; b.txnId = 'TXN-'+(770000+Math.floor(Math.random()*9999));
        f.notifications.unshift({id:Date.now(),title:'Payment Completed',body:fmtINR(b.amount)+' credited for token '+b.token+'.',time:'Just now',read:false,icon:'💰'});
        render(); showToast('Payment completed','💰');
      };
      sim.appendChild(btn);
      wrap.appendChild(sim);
    }
  } else if(!b) {
    wrap.appendChild(el('<div class="card" style="margin-top:14px;"><div class="empty-state"><div class="es-ic">💳</div><h4>No active payment</h4><p>Book a slot and complete procurement to see payment tracking here.</p></div></div>'));
  }

  wrap.appendChild(el('<div class="section-label" style="margin-top:16px;">All Transactions</div>'));
  if(!f.bookings.length){
    wrap.appendChild(el('<p style="font-size:12.5px;color:var(--text-faint);">No past transactions yet.</p>'));
  }
  f.bookings.forEach(hb=>{
    const row = el('<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;"></div>');
    row.innerHTML =
      '<div><b style="font-size:13px;">'+CROP_ICONS[hb.crop]+' '+hb.crop+' · '+(hb.amount?fmtINR(hb.amount):'—')+'</b>'+
      '<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">'+hb.date+' · '+hb.token+'</div></div>';
    const right = el('<div style="display:flex;align-items:center;gap:8px;"></div>');
    right.appendChild(el('<span class="badge badge-'+(hb.paymentStatus==='Completed'?'success':'warning')+'">'+hb.paymentStatus+'</span>'));
    const viewBtn = el('<button class="btn btn-outline btn-sm">View</button>');
    viewBtn.onclick = ()=>showTransactionModal(hb);
    right.appendChild(viewBtn);
    row.appendChild(right);
    wrap.appendChild(row);
  });

  return wrap;
}

  wrap.appendChild(s2);

  // AM I READY — Readiness Score
  const rs = aiReadinessScore();
  const s3 = el('<div class="ai-section"></div>');
  s3.appendChild(el('<div class="ai-section-head"><h5>✅ Am I ready to go?</h5><span class="ai-q">Procurement Readiness Score</span></div>'));

  const cl = f.readinessChecklist;
  const keyMap = {0:null, 1:null, 2:'aadhaar', 3:'bags', 4:'moisture', 5:'sample'};
  rs.items.forEach((item,i)=>{

    const row = el('<div class="check-item"></div>');
    const box = el('<div class="check-box'+(item.done?' on':'')+'">'+(item.done?'✓':'')+'</div>');

  s3.appendChild(scoreCard);

  const s4 = el('<div class="ai-section"></div>');

/* ---- Screen: AI Crop Pre-Check (plan 13.1) ---- */
function screenCropCheck(){
  const f = state.farmer;
  const cc = f.cropCheck;
  const crop = (f.activeBooking && f.activeBooking.crop) || f.bookingDraft.crop || 'crop';
  const wrap = el('<div></div>');

  wrap.appendChild(el('<div class="ai-disclaimer"><span style="font-size:16px;">📷</span>'+
    '<div><b>Preliminary visual assessment only.</b> This AI result does not approve or reject the crop. '+
    'Final quality assessment will be performed by the authorised procurement officer at the procurement centre.</div></div>'));

  /* ---- Stage 1: idle — upload UI ---- */
  if(cc.stage==='idle'){
    const card = el('<div class="upload-drop"></div>');
    card.appendChild(el('<div class="ud-ic">📸</div>'));
    card.appendChild(el('<h5>Pre-Check My Crop</h5>'));
    card.appendChild(el('<p>Upload a clear photo of your crop for a preliminary visual assessment.</p>'));
    wrap.appendChild(card);

    const fileInput = document.createElement('input');
    fileInput.type='file'; fileInput.accept='image/*'; fileInput.style.display='none';
    const cameraInput = document.createElement('input');
    cameraInput.type='file'; cameraInput.accept='image/*'; cameraInput.setAttribute('capture','environment'); cameraInput.style.display='none';

    function handleFile(file){
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (e)=>{
        cc.imageDataUrl = e.target.result;
        cc.fileName = file.name;
        cc.stage = 'preview';
        render();
      };
      reader.readAsDataURL(file);
    }
    fileInput.onchange = (e)=>handleFile(e.target.files[0]);
    cameraInput.onchange = (e)=>handleFile(e.target.files[0]);

    const row = el('<div style="display:flex;gap:10px;margin-top:14px;"></div>');
    const uploadBtn = el('<button class="btn btn-primary btn-block">📁 Upload Crop Image</button>');
    uploadBtn.onclick = ()=>fileInput.click();
    const cameraBtn = el('<button class="btn btn-outline btn-block">📷 Take Photo</button>');
    cameraBtn.onclick = ()=>cameraInput.click();
    row.appendChild(uploadBtn); row.appendChild(cameraBtn);
    wrap.appendChild(row);
    wrap.appendChild(fileInput);
    wrap.appendChild(cameraInput);
  }

  /* ---- Stage 2: preview — image shown, ready to analyze ---- */
  else if(cc.stage==='preview'){
    const prevCard = el('<div class="card"></div>');
    prevCard.appendChild(el('<div class="section-label">Image Preview</div>'));
    const img = document.createElement('img');
    img.className = 'img-preview'; img.src = cc.imageDataUrl;
    prevCard.appendChild(img);
    prevCard.appendChild(el('<p style="font-size:11.5px;color:var(--success);margin-top:8px;">✓ Image uploaded: '+escapeHtml(cc.fileName||'photo.jpg')+'</p>'));
    wrap.appendChild(prevCard);

    const row = el('<div style="display:flex;gap:10px;margin-top:12px;"></div>');
    const changeBtn = el('<button class="btn btn-outline btn-block">Change Image</button>');
    changeBtn.onclick = ()=>{ resetCropCheck(); render(); };
    const analyzeBtn = el('<button class="btn btn-accent btn-block">🤖 Analyze Crop</button>');
    analyzeBtn.onclick = ()=>{
      cc.stage = 'analyzing'; render();
      setTimeout(()=>{
        const r = analyzeCropImage(cc.imageDataUrl, cc.fileName, crop);
        cc.result = r.result; cc.note = r.note; cc.observations = r.observations;
        cc.stage = 'result'; render();
      }, 1600);
    };
    row.appendChild(changeBtn); row.appendChild(analyzeBtn);
    wrap.appendChild(row);
  }

  /* ---- Stage 3: analyzing — processing animation ---- */
  else if(cc.stage==='analyzing'){
    const img = document.createElement('img');
    img.className = 'img-preview'; img.style.maxHeight='150px'; img.style.opacity='0.55';
    img.src = cc.imageDataUrl;
    wrap.appendChild(img);
    const p = el('<div class="card" style="text-align:center;padding:28px 14px;margin-top:12px;"></div>');
    p.appendChild(el('<div class="spinner"></div>'));
    p.appendChild(el('<p style="margin-top:14px;font-weight:800;font-size:13.5px;">🤖 AI Analysis in progress...</p>'));
    p.appendChild(el('<p style="font-size:12px;color:var(--text-muted);margin-top:4px;">Checking visible crop characteristics...</p>'));
    wrap.appendChild(p);
  }

  /* ---- Stage 4: result ---- */
  else if(cc.stage==='result'){
    const img = document.createElement('img');
    img.className = 'img-preview'; img.style.maxHeight='150px';
    img.src = cc.imageDataUrl;
    wrap.appendChild(img);

    const r = cc.result;
    const box = el('<div class="crop-result '+r+'" style="margin-top:12px;"></div>');
    box.appendChild(el('<h6>🤖 Preliminary Visual Assessment</h6>'));
    box.appendChild(el('<p style="font-size:11.5px;color:var(--success);margin-top:2px;">✓ Image successfully analyzed</p>'));
    box.appendChild(el('<p style="margin-top:8px;"><b>'+(r==='clean'?'🟢 No obvious visual concern detected':'⚠️ Possible Quality Concern')+'</b></p>'));
    const ul = el('<ul class="obs-list"></ul>');
    cc.observations.forEach(o=>ul.appendChild(el('<li>'+escapeHtml(o)+'</li>')));
    box.appendChild(ul);
    if(r==='concern'){
      box.appendChild(el('<p style="margin-top:8px;"><b>Recommendation:</b> Consider checking the crop against the procurement centre\'s official quality requirements before visiting.</p>'));
    }
    wrap.appendChild(box);

    const nav = el('<div style="display:flex;gap:10px;margin-top:14px;"></div>');
    const again = el('<button class="btn btn-outline btn-block">Analyze Another</button>');
    again.onclick = ()=>{ resetCropCheck(); render(); };
    const cont = el('<button class="btn btn-primary btn-block">Continue to Booking</button>');
    cont.onclick = ()=>{ f.screen='booking'; if(!f.bookingStep) f.bookingStep=1; render(); };
    nav.appendChild(again); nav.appendChild(cont);
    wrap.appendChild(nav);

    const back = el('<button class="btn btn-ghost btn-block" style="margin-top:8px;border:1.5px solid var(--border);">Back to AI Assistant</button>');
    back.onclick = ()=>{ f.screen='ai'; render(); };
    wrap.appendChild(back);
  }

  return wrap;
}

function officerScreenQueue(){
  const o = state.officer;
  const wrap = el('<div></div>');

  controls.appendChild(el('<p style="font-size:12.5px;color:var(--text-muted);max-width:520px;">Manage the live queue: call the next farmer, check them in, start processing, complete, or skip a token. Changes reflect instantly on the farmer\'s app.</p>'));
  const callNextBtn = el('<button class="btn btn-accent btn-sm">📢 Call Next Token</button>');
  callNextBtn.onclick = ()=>{ callNextToken(o.centreId); render(); };
  controls.appendChild(callNextBtn);
  wrap.appendChild(controls);

  wrap.appendChild(el('<div class="card"></div>')).appendChild(buildQueueTable(o.centreId, {compact:false}));

function callNextToken(centreId){
  const q = state.queues[centreId];
  const processing = q.find(x=>x.status==='Processing');
  if(processing){ showToast('A token is already being processed','⚠️'); return; }
  const nextArrived = q.find(x=>x.status==='Arrived');
  if(nextArrived){ nextArrived.status='Processing'; showToast('Calling token '+nextArrived.token,'📢'); syncFarmerFromQueue(centreId); return; }
  showToast('No arrived farmers waiting to be called','ℹ️');
}

function syncFarmerFromQueue(centreId){
  const f = state.farmer;
  if(!f.activeBooking || f.activeBooking.centreId!==centreId) return;
  const mine = state.queues[centreId].find(x=>x.token===f.activeBooking.token);
  if(!mine) return;
  const map = {Booked:'Booked', Arrived:'Arrived', Processing:'Verification', Completed:'Completed', Skipped:'Skipped'};
  if(map[mine.status]) f.activeBooking.status = map[mine.status];
}

function buildQueueTable(centreId, opts){
  opts = opts || {};
  const o = state.officer;
  let q = state.queues[centreId].slice();
  const order = {Processing:0, Arrived:1, Booked:2, Completed:3, Skipped:4};
  q.sort((a,b)=> (order[a.status]??9)-(order[b.status]??9) );
  if(opts.limit) q = q.slice(0, opts.limit);

  const table = el('<table class="data-table"></table>');
  const thead = el('<thead><tr><th>Token</th><th>Farmer</th><th>Crop</th><th>Qty</th><th>Status</th>'+(opts.compact?'':'<th>Actions</th>')+'</tr></thead>');
  table.appendChild(thead);
  const tbody = el('<tbody></tbody>');
  if(!q.length){ tbody.appendChild(el('<tr><td colspan="6" style="text-align:center;color:var(--text-faint);padding:20px;">No tokens in queue</td></tr>')); }
  q.forEach(row=>{
    const tr = el('<tr></tr>');
    if(row.status==='Processing') tr.classList.add('current-row');
    tr.innerHTML =
      '<td style="font-family:var(--font-mono);font-weight:700;">'+row.token+'</td>'+
      '<td>'+row.farmer+'<div style="font-size:10.5px;color:var(--text-faint);">'+row.farmerId+'</div></td>'+
      '<td>'+CROP_ICONS[row.crop]+' '+row.crop+'</td>'+
      '<td>'+row.quantity+' qtl</td>'+
      '<td><span class="badge badge-'+statusBadgeType(row.status)+'">'+row.status+'</span></td>';
    if(!opts.compact){
      const actionsTd = el('<td></td>');
      const actions = el('<div class="table-actions"></div>');
      if(row.status==='Booked'){
        const b = el('<button class="btn btn-outline btn-sm">Check In</button>');
        b.onclick=()=>{ row.status='Arrived'; syncFarmerFromQueue(centreId); render(); showToast(row.token+' checked in','✅'); };
        actions.appendChild(b);
      }
      if(row.status==='Arrived'){
        const b = el('<button class="btn btn-primary btn-sm">Start Processing</button>');
        b.onclick=()=>{
          const already = state.queues[centreId].find(x=>x.status==='Processing');
          if(already){ showToast('Finish current token first','⚠️'); return; }
          row.status='Processing'; syncFarmerFromQueue(centreId);
          o.selectedToken = row.token; o.screen='verification'; render();
        };
        actions.appendChild(b);
        const skip = el('<button class="btn btn-ghost btn-sm" style="border:1px solid var(--border);">Skip</button>');
        skip.onclick=()=>{ row.status='Skipped'; syncFarmerFromQueue(centreId); render(); showToast(row.token+' skipped','⏭️'); };
        actions.appendChild(skip);
      }
      if(row.status==='Processing'){
        const b = el('<button class="btn btn-accent btn-sm">Complete →</button>');
        b.onclick=()=>{ o.selectedToken=row.token; o.screen='procurement'; render(); };
        actions.appendChild(b);
      }
      actionsTd.appendChild(actions);
      tr.appendChild(actionsTd);
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

  const row = el('<div class="two-col"></div>');

/* ---- Officer: Procurement Entry ---- */
function officerScreenProcurement(){
  const o = state.officer;
  const q = state.queues[o.centreId];
  const selected = q.find(x=>x.token===o.selectedToken && x.status==='Processing') || q.find(x=>x.status==='Processing');

  const wrap = el('<div></div>');
  if(!selected){
    wrap.appendChild(el('<div class="empty-state"><div class="es-ic">⚖️</div><h4>No token currently in processing</h4><p>Start processing a farmer from the Live Queue tab.</p></div>'));
    return wrap;
  }

  const card = el('<div class="card" style="max-width:560px;"></div>');
  card.appendChild(el('<div class="section-label">Farmer: '+selected.farmer+' ('+selected.farmerId+') · Token '+selected.token+'</div>'));
  const grid = el('<div class="grid-2"></div>');
  grid.appendChild(el('<div class="field"><label>Expected Quantity</label><input class="input" value="'+selected.quantity+' quintals" disabled/></div>'));
  grid.appendChild(el('<div class="field"><label>Actual Quantity (quintals)</label><input class="input" id="actualQty" type="number" step="0.1" value="'+(Math.round(selected.quantity*0.9*10)/10)+'"/></div>'));
  card.appendChild(grid);

  card.appendChild(el('<div class="field"><label>Quality / Inspection Result</label></div>'));
  const chipRow = el('<div class="chip-row" style="margin-bottom:14px;"></div>');
  let inspection = 'Accepted';
  ['Accepted','Rejected','Needs Inspection'].forEach(opt=>{
    const c = el('<div class="chip">'+opt+'</div>');
    if(opt==='Accepted') c.classList.add('selected');
    c.style.cursor='pointer';
    c.onclick=()=>{ [...chipRow.children].forEach(x=>x.classList.remove('selected')); c.classList.add('selected'); inspection=opt; };
    chipRow.appendChild(c);
  });
  card.appendChild(chipRow);

  card.appendChild(el('<div class="field"><label>Remarks</label><textarea class="input" id="remarks" rows="2" placeholder="Optional remarks"></textarea></div>'));

  const submitBtn = el('<button class="btn btn-accent btn-block">Complete Procurement</button>');
  submitBtn.onclick = ()=>{
    const actualQty = parseFloat(document.getElementById('actualQty').value) || selected.quantity;
    selected.status='Completed';
    state.completedToday[o.centreId] = (state.completedToday[o.centreId]||0)+1;
    state.pendingPayments[o.centreId] = (state.pendingPayments[o.centreId]||0)+1;

    const f = state.farmer;
    if(f.activeBooking && f.activeBooking.token===selected.token){
      const rate = {Paddy:2320, Wheat:2275, Maize:2090, Cotton:6620, Other:2000}[selected.crop]||2200;
      f.activeBooking.status='Completed';
      f.activeBooking.acceptedQty = actualQty;
      f.activeBooking.rate = rate;
      f.activeBooking.amount = Math.round(actualQty*rate);
      f.activeBooking.paymentStatus='Processing';
      f.activeBooking.inspection = inspection;
      f.activeBooking.remarks = (document.getElementById('remarks').value||'').trim();
      f.notifications.unshift({id:Date.now(),title:'Procurement Completed',body:'Accepted '+actualQty+' qtl of '+selected.crop+'. Payment processing started.',time:'Just now',read:false,icon:'✅'});
    }
    o.screen='queue'; o.selectedToken=null; render();
    showToast('Procurement completed for '+selected.token,'✅');
  };
  card.appendChild(submitBtn);
  wrap.appendChild(card);
  return wrap;
}

    const done = state.completedToday[c.id]||0;
    const waiting = (state.queues[c.id]||[]).filter(x=>x.status==='Booked'||x.status==='Arrived').length;
    const pct = Math.round(100*c.bookedToday/c.dailyCapacity);
    const load = centreLoad(c);
    tb.appendChild(el('<tr><td><b>'+c.name.split('—')[1].trim()+'</b></td><td>'+c.bookedToday+'</td><td>'+done+'</td><td>'+waiting+'</td>'+
      '<td>'+pct+'% of '+c.dailyCapacity+'</td><td>'+(state.pendingPayments[c.id]||0)+'</td>'+
      '<td><span class="centre-load-badge load-'+load+'">'+load+'</span></td></tr>'));
  });
  tb.appendChild(el('<tr style="background:var(--surface-2);font-weight:700;"><td>All centres</td><td>'+totalBooked+'</td><td>'+totalCompleted+'</td><td>'+totalWaiting+'</td><td>—</td><td>'+totalPendingPay+'</td><td>—</td></tr>'));
  card.appendChild(tbl);

  const actions = el('<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;"></div>');
  const dl = el('<button class="btn btn-primary btn-sm">Download CSV</button>');
  dl.onclick = ()=>{
    const lines = [['Centre','Booked','Completed','Waiting','Capacity','Pending Payments','Load']];
    state.centres.forEach(c=>lines.push([
      c.name.split('—')[1].trim(), c.bookedToday, state.completedToday[c.id]||0,
      (state.queues[c.id]||[]).filter(x=>x.status==='Booked'||x.status==='Arrived').length,
      c.dailyCapacity, state.pendingPayments[c.id]||0, centreLoad(c)
    ]));
    const csv = lines.map(r=>r.join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'farmsync-daily-report.csv';
    a.click(); URL.revokeObjectURL(a.href);
    showToast('Daily report downloaded','⬇️');
  };
  const pr = el('<button class="btn btn-outline btn-sm">Print / Save as PDF</button>');
  pr.onclick = ()=>window.print();
  actions.appendChild(dl); actions.appendChild(pr);
  card.appendChild(actions);
  card.appendChild(el('<p class="rep-note">Figures update live as officers complete tokens and as farmers book slots, so the report always reflects the current state of every centre.</p>'));
  wrap.appendChild(card);

  const pay = el('<div class="card" style="margin-top:16px;"></div>');
  pay.appendChild(el('<div class="section-label">Payment Settlement Summary</div>'));
  const grid = el('<div class="kv-grid"></div>');
  const settled = state.farmer.bookings.filter(b=>b.paymentStatus==='Completed');
  const settledAmt = settled.reduce((s,b)=>s+(b.amount||0),0);
  [['Transactions settled', settled.length],
   ['Amount settled', fmtINR(settledAmt)],
   ['Payments pending', totalPendingPay],
   ['Avg processing time', Math.round(state.centres.reduce((s,c)=>s+c.avgProcessingMin,0)/state.centres.length)+' min']
  ].forEach(([k,v])=>grid.appendChild(el('<div class="list-row"><span class="lr-label">'+k+'</span><span class="lr-value">'+v+'</span></div>')));
  pay.appendChild(grid);
  wrap.appendChild(pay);
  return wrap;
}

/* ---- Admin: Settings ---- */
function adminScreenSettings(){
  const st = state.admin.settings;
  const wrap = el('<div></div>');

  const card = el('<div class="card" style="max-width:660px;"></div>');
  card.appendChild(el('<div class="section-label">Booking & Notification Rules</div>'));

  function toggleRow(label, sub, key){
    const row = el('<div class="toggle-row"><div><div class="tr-label">'+label+'</div><div class="tr-sub">'+sub+'</div></div></div>');
    const sw = el('<button class="switch'+(st[key]?' on':'')+'" aria-label="'+label+'"></button>');
    sw.onclick = ()=>{ st[key] = !st[key]; render(); showToast(label+' '+(st[key]?'enabled':'disabled'), st[key]?'✅':'🚫'); };
    row.appendChild(sw);
    return row;
  }
  card.appendChild(toggleRow('SMS alerts to farmers','Send booking, queue and payment updates over SMS for low-connectivity users.','smsAlerts'));
  card.appendChild(toggleRow('Auto-close full centres','Stop accepting bookings once a centre reaches its daily capacity.','autoCloseFullCentres'));
  card.appendChild(toggleRow('Allow reschedule','Let farmers move their slot to another date without cancelling.','allowReschedule'));
  wrap.appendChild(card);

  const card2 = el('<div class="card" style="max-width:660px;margin-top:16px;"></div>');
  card2.appendChild(el('<div class="section-label">Turn-Approaching Alert</div>'));
  card2.appendChild(el('<p style="font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-bottom:12px;">Notify a farmer once this many farmers remain ahead of them in the queue.</p>'));
  const f = el('<div class="field" style="max-width:220px;"><label>Farmers remaining</label><input class="input" type="number" min="1" max="10" value="'+st.turnAlertLead+'"/></div>');
  card2.appendChild(f);
  const save = el('<button class="btn btn-primary btn-sm">Save alert rule</button>');
  save.onclick = ()=>{
    const v = parseInt(f.querySelector('input').value,10);
    if(!v || v<1 || v>10){ showToast('Enter a number between 1 and 10','⚠️'); return; }
    st.turnAlertLead = v; state.farmer._turnAlerted = false;
    render(); showToast('Alert rule saved','✅');
  };
  card2.appendChild(save);
  wrap.appendChild(card2);

  const card3 = el('<div class="card" style="max-width:660px;margin-top:16px;"></div>');
  card3.appendChild(el('<div class="section-label">Prototype Controls</div>'));
  card3.appendChild(el('<p style="font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-bottom:12px;">Reset every centre, queue, booking and payment back to the seeded demo state. Use this between jury runs.</p>'));
  const reset = el('<button class="btn btn-danger-outline btn-sm">Reset demo data</button>');
  reset.onclick = ()=>{
    if(SIM_TIMER){ clearInterval(SIM_TIMER); SIM_TIMER=null; }
    state = initState();
    render();
    showToast('Demo data reset to its starting state','🔄');
  };
  card3.appendChild(reset);
  wrap.appendChild(card3);
  return wrap;
}

function renderDemoGuide(){
  const d = state.demo;
  if(!d.open){
    return document.createComment('guided-demo-closed');
  }
  const step = DEMO_STEPS[d.step];
  const panel = el('<div class="demo-panel"></div>');

  const head = el('<div class="demo-head"><div><h4>Guided walkthrough</h4><div class="dh-sub">FARMSYNC DEMO</div></div></div>');
  const close = el('<button class="demo-close" aria-label="Close guided demo">×</button>');
  close.onclick = ()=>{ d.open=false; render(); };
  head.appendChild(close);
  panel.appendChild(head);

  const body = el('<div class="demo-body"></div>');
  body.appendChild(el('<div class="demo-count">STEP '+(d.step+1)+' OF '+DEMO_STEPS.length+'</div>'));
  body.appendChild(el('<h5>'+step.title+'</h5>'));
  body.appendChild(el('<p>'+step.body+'</p>'));
  body.appendChild(el('<div class="demo-say">🗣 '+step.say+'</div>'));

  const prog = el('<div class="demo-progress"></div>');
  DEMO_STEPS.forEach((_,i)=>prog.appendChild(el('<span'+(i<=d.step?' class="done"':'')+'></span>')));
  body.appendChild(prog);

  const nav = el('<div class="demo-nav"></div>');
  const prev = el('<button class="btn btn-outline btn-sm">Back</button>');
  prev.disabled = d.step===0;
  if(d.step===0) prev.style.opacity='0.45';
  prev.onclick = ()=>{ d.step--; DEMO_STEPS[d.step].go(); render(); };
  nav.appendChild(prev);

  if(d.step < DEMO_STEPS.length-1){
    const next = el('<button class="btn btn-primary btn-sm">Next step</button>');
    next.onclick = ()=>{ d.step++; DEMO_STEPS[d.step].go(); render(); };
    nav.appendChild(next);
  } else {
    const done = el('<button class="btn btn-accent btn-sm">Finish</button>');
    done.onclick = ()=>{ d.open=false; render(); showToast('Demo complete','🎉'); };
    nav.appendChild(done);
  }
  body.appendChild(nav);
  panel.appendChild(body);
  return panel;
}
